<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>公共采购密封投标</title>
<style>body{font:15px/1.6 system-ui,sans-serif;max-width:1180px;margin:28px auto;padding:0 20px;color:#28343e}table{border-collapse:collapse;width:100%;margin:14px 0}th,td{border:1px solid #d5dde3;padding:7px}th{background:#eef4f7}.card{background:#eef8f3;border-left:5px solid #23845b;padding:12px 16px}.contract{border:1px solid #d5dde3;border-radius:6px;padding:12px 16px;margin:14px 0}.todo{color:#8a5a00}.ok{color:#23845b}code{background:#edf0f2;padding:2px 5px}input,select,button{font:inherit;padding:3px 6px}</style>
<h1>公共采购密封投标与评审</h1><div class="card">公开页面只展示项目元数据与履约状态，投标正文和合同金额明细按角色与执行阶段隐藏。写接口需要 <code>X-User</code>、<code>X-Role</code>。</div>
<p>查看身份：<input id="user" placeholder="X-User" size="12">
<select id="role"><option>public</option><option>procurement</option><option>vendor</option><option>evaluator</option><option>supervisor</option><option>auditor</option></select>
<button onclick="load()">刷新</button></p>
<h2>采购项目</h2><table id="tenders"><thead><tr><th>编号</th><th>标题</th><th>状态</th><th>截止时间</th><th>评审轮次</th><th>版本</th></tr></thead><tbody></tbody></table>
<h2>投标元数据</h2><table id="bids"><thead><tr><th>项目</th><th>供应商</th><th>报价</th><th>状态</th><th>承诺哈希</th></tr></thead><tbody></tbody></table>
<h2>履约验收台</h2><div id="performance"></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load(){
  const headers={};const u=document.querySelector('#user').value.trim();const r=document.querySelector('#role').value;
  if(u)headers['X-User']=u;if(r)headers['X-Role']=r;
  const d=await fetch('/api/state',{headers}).then(r=>r.json());
  document.querySelector('#tenders tbody').innerHTML=d.tenders.map(r=>`<tr><td>${esc(r.tender_no)}</td><td>${esc(r.title)}</td><td>${r.status}</td><td>${r.deadline}</td><td>${r.evaluation_round}</td><td>${r.version}</td></tr>`).join('');
  document.querySelector('#bids tbody').innerHTML=d.bids.map(r=>`<tr><td>${r.tender_id}</td><td>${r.vendor_id}</td><td>${r.price}</td><td>${r.status}</td><td>${(r.payload_hash||'').slice(0,12)}…</td></tr>`).join('');
  renderPerformance(d.performance||[]);
}
function renderPerformance(list){
  const el=document.querySelector('#performance');
  if(!list.length){el.innerHTML='<p>暂无履约合同。</p>';return}
  el.innerHTML=list.map(p=>{
    const money=p.total_amount!==undefined;
    const cur=p.current_milestone?`节点${p.current_milestone.seq} ${esc(p.current_milestone.name)}（${p.current_milestone.status}）`:'<span class="ok">全部节点已完成</span>';
    const head=money?'<tr><th>节点</th><th>名称</th><th>状态</th><th>节点金额</th><th>已验收</th><th>已付款</th></tr>':'<tr><th>节点</th><th>名称</th><th>状态</th></tr>';
    const rows=p.milestones.map(m=>money
      ?`<tr><td>${m.seq}</td><td>${esc(m.name)}</td><td>${m.status}</td><td>${m.amount}</td><td>${m.accepted_amount}</td><td>${m.paid_amount}</td></tr>`
      :`<tr><td>${m.seq}</td><td>${esc(m.name)}</td><td>${m.status}</td></tr>`).join('');
    const summary=money?`合同额 ${p.total_amount}　累计验收 ${p.totals.accepted}　累计付款 ${p.totals.paid}`:'公开视图仅显示履约状态，不显示金额明细';
    const todos=(p.todos&&p.todos.length)?`<p>待办：</p><ul>${p.todos.map(t=>`<li class="todo">${esc(t.text)}</li>`).join('')}</ul>`:'';
    return `<div class="contract"><h3>${esc(p.tender_title)} ／ 合同 ${esc(p.contract_no)}（${p.contract_status}）</h3><p>当前节点：${cur}　${summary}</p><table><thead>${head}</thead><tbody>${rows}</tbody></table>${todos}</div>`;
  }).join('');
}
load()
</script></html>
